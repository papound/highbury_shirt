name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: 192.168.1.117:5000
  IMAGE: 192.168.1.117:5000/highbury/app
  INFISICAL_API_URL: https://infisical.papoundhomelab.ddnsgeek.com
  INFISICAL_PROJECT_ID: a27fb93f-82c8-4ea4-a71f-ba1b5aeeada7

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Build และ Push image ไปยัง Private Registry
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tags/metadata
        id: meta
        run: |
          SHA_TAG="${{ env.IMAGE }}:${{ github.sha }}"
          LATEST_TAG="${{ env.IMAGE }}:latest"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building: ${SHA_TAG}"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.meta.outputs.sha_tag }}" \
            --tag "${{ steps.meta.outputs.latest_tag }}" \
            --build-arg GIT_REVISION="${{ github.sha }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Push to private registry
        run: |
          docker push "${{ steps.meta.outputs.sha_tag }}"
          docker push "${{ steps.meta.outputs.latest_tag }}"

      - name: Clean up old local images (keep last 5)
        run: |
          docker images "${{ env.IMAGE }}" --format "{{.ID}}" | tail -n +6 | xargs -r docker rmi || true

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy — SSH เข้า Production แล้ว pull image ใหม่
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: build
    environment: production

    steps:
      - name: Sync .env from Infisical to Production
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TOKEN=$(infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --silent --plain)

          infisical export \
            --projectId="${{ env.INFISICAL_PROJECT_ID }}" \
            --env=prod \
            --format=dotenv \
            --token="$TOKEN" \
            | ssh -o StrictHostKeyChecking=no root@192.168.1.65 \
              "umask 077 && cat > /opt/highbury-shirt/.env.tmp && mv /opt/highbury-shirt/.env.tmp /opt/highbury-shirt/.env && chown app:app /opt/highbury-shirt/.env && chmod 600 /opt/highbury-shirt/.env"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e

            echo "==> Ensuring insecure registry is configured..."
            DAEMON=/etc/docker/daemon.json
            if ! grep -q "192.168.1.117:5000" "$DAEMON" 2>/dev/null; then
              echo '{ "insecure-registries": ["192.168.1.117:5000"] }' > "$DAEMON"
              systemctl restart docker
              sleep 3
            fi

            cd /opt/highbury-shirt

            git config --global --add safe.directory /opt/highbury-shirt || true

            echo "==> Resetting local workspace changes..."
            git reset --hard
            git clean -fd -e .env -e .env.*

            echo "==> Pulling latest code and compose configurations..."
            git pull origin main

            echo "==> Pruning unused Docker data to free space..."
            docker system prune -af

            echo "==> Pulling latest image from registry..."
            docker compose pull app

            echo "==> Restarting app container (zero-downtime)..."
            docker compose up -d --no-build --wait app

            echo "==> Running DB migrations..."
            docker compose exec -T app npx prisma migrate deploy || {
              echo "migrate deploy failed"
              exit 1
            }

            echo "==> Verifying container health..."
            docker compose ps app

            echo "✓ Deploy completed at $(date)"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy failed! ตรวจสอบ logs ด้วย: docker compose logs --tail=50 app"

      - name: Cleanup CI runner
        if: always()
        run: |
          docker system prune -af
          rm -rf ~/actions-runner/_work/*
